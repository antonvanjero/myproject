{% load static %}
<html>
    <head>
        <title>templates_demo</title>
        <link rel="stylesheet" href="{% static 'myapp/hello.css' %}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    </head>
    <body>
        <h1>My name is {{name}} and my age is {{age}}</h1>
        <p style="color: blue;">hello world</p>
        <div style="padding: 50px;background-color: #b44f4f; display: inline-block;">box</div>
        {% block content %}
        {% endblock %}
        <p class="text-primary">this is an example of bootstrap</p>
        <form >
            <label for="name">name</label>
            <input type="text" id="name">
        </form>
    </body>
</html>
